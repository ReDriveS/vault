
{{- if .Values.unsealer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-unsealer-watcher
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-unsealer-watcher
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-unsealer-watcher
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: vault-unsealer-watcher
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: vault-unsealer-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-unsealer-watcher-script
  namespace: {{ .Release.Namespace }}
data:
  watcher.py: |
{{ .Files.Get "scripts/watcher.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unsealer-watcher
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: vault-unsealer-watcher

  template:
    metadata:
      labels:
        app: vault-unsealer-watcher
      annotations:
        checksum/script: {{ .Files.Get "scripts/watcher.py" | sha256sum }}

    spec:
      serviceAccountName: vault-unsealer-watcher
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: watcher
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -u
            - /app/watcher.py

          env:
            - name: VAULT_ADDR
              value: "http://{{ .Values.vault.service }}.{{ .Values.vault.namespace }}.svc.cluster.local:{{ .Values.vault.port }}"

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: CHECK_INTERVAL
              value: {{ .Values.unsealer.checkIntervalSeconds | quote }}

            - name: RETRY_INTERVAL
              value: {{ .Values.unsealer.retryIntervalSeconds | quote }}

            - name: SUCCESS_TTL
              value: {{ .Values.unsealer.successfulJobTTLSeconds | quote }}

            - name: FAILED_TTL
              value: {{ .Values.unsealer.failedJobTTLSeconds | quote }}

            - name: JOB_IMAGE
              value: {{ .Values.unsealer.jobImage | quote }}

            - name: KEYS_SECRET_NAME
              value: {{ .Values.unsealer.keysSecretName | quote }}

            - name: UNSEAL_SCRIPT_CONFIGMAP
              value: "vault-unsealer-script"

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true

      volumes:
        - name: script
          configMap:
            name: vault-unsealer-watcher-script
            defaultMode: 0444
{{- end }}
